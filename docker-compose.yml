# =====================================================================
# Stack de production / démo (à lancer en dehors du DevContainer).
#
#   docker compose up --build
#
#   Frontend (web) : http://localhost:8080
#   API Laravel    : http://localhost:8000
#   Adminer (DB)   : http://localhost:8082   (serveur: db / user: user / pass: password)
#   MySQL          : localhost:3306
#
# Le DevContainer (.devcontainer/) reste l'environnement de développement.
# =====================================================================

services:
  # ----- Base de données -----------------------------------------------
  db:
    image: mysql:8
    restart: unless-stopped
    # Autorise les utilisateurs non-SUPER à créer des fonctions stockées
    # (migration créant la fonction DISTANCE) malgré le binary logging.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # ----- API Laravel ---------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: app
      DB_USERNAME: user
      DB_PASSWORD: password
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ----- Frontend Nuxt (statique servi par nginx) ----------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        APP_NAME: AppMobile
        WEBAPI_URL: http://localhost:8000
        APPAPI_URL: http://10.0.2.2:8000
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  # ----- Adminer (interface web pour MySQL) ----------------------------
  adminer:
    image: adminer:4
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
