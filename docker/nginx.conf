# Configuration nginx pour servir le SPA Nuxt statique
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Routage côté client : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnés
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
